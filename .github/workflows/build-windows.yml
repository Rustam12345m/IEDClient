name: Build Windows

on: [push, pull_request]

jobs:

  archive:
    name: Build zip archive
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=install
          -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release

      - name: Deploy Qt DLLs
        run: |
          New-Item -ItemType Directory -Force -Path dist\IEDClient
          Copy-Item install\bin\IEDClient.exe dist\IEDClient\
          windeployqt6 --qmldir ui --release dist\IEDClient\IEDClient.exe

      - name: Create zip
        run: Compress-Archive -Path dist\IEDClient -DestinationPath dist\IEDClient-windows-x86_64.zip

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: IEDClient-windows-archive
          path: dist\IEDClient-windows-x86_64.zip
