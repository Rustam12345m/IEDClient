name: Build and Test on Windows

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: true
        fetch-depth: 0 
        recursive: true 

    - name: Build Docker image
      run: docker build -f docker/Dockerfile.Windows -t iedclient:windows docker/

    - name: Run Docker container
      run: docker run -v ${{ github.workspace }}:/app/ iedclient:windows /bin/bash -c "ls -la /app/ ; /app/ci/build.sh --release"
