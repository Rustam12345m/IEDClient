name: Build Windows

on: [push, pull_request]

jobs:

  archive:
    name: Build zip archive
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.*'
          arch: win64_mingw
          tools: tools_mingw1310

      - name: Install dump_syms
        run: cargo install dump_syms@2.3.6 --locked

      - name: Apply libiec61850 patches
        shell: bash
        run: |
          echo "Listing patches:"
          ls -la 3rdparty/libiec61850-*.patch || echo "No patches found!"
          cd 3rdparty/libiec61850
          for patch in "$GITHUB_WORKSPACE"/3rdparty/libiec61850-*.patch; do
            if [ -f "$patch" ]; then
              echo "==> Applying $(basename "$patch")..."
              git apply "$patch"
              echo "    Applied successfully."
            fi
          done

      - name: Configure
        run: >
          cmake -S . -B build
          -G "MinGW Makefiles"
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_INSTALL_PREFIX=install
          -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build

      - name: Deploy Qt DLLs
        run: |
          New-Item -ItemType Directory -Force -Path dist\IEDClient
          Copy-Item install\bin\IEDClient.exe dist\IEDClient\
          windeployqt6 --qmldir ui --release dist\IEDClient\IEDClient.exe

      - name: Create zip
        run: Compress-Archive -Path dist\IEDClient -DestinationPath dist\IEDClient-windows-x86_64.zip

      - name: Extract symbols
        shell: bash
        run: |
          dump_syms install/bin/IEDClient.exe > IEDClient.sym
          BUILD_ID=$(head -1 IEDClient.sym | awk '{print $4}')
          mkdir -p dist/symbols/IEDClient.exe/$BUILD_ID/
          cp IEDClient.sym dist/symbols/IEDClient.exe/$BUILD_ID/IEDClient.exe.sym

      - name: Create symbols zip
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION "(.+)"').Matches.Groups[1].Value
          Compress-Archive -Path dist\symbols -DestinationPath dist\IEDClient_syms_windows_$version.zip

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: IEDClient-windows-archive
          path: dist\IEDClient-windows-x86_64.zip

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: IEDClient-windows-symbols
          path: dist\*_syms_windows_*.zip
