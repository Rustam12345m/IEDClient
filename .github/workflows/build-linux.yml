name: Build Linux

on: [push, pull_request]

jobs:

  appimage:
    name: Test + AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Docker image
        uses: actions/cache@v4
        id: cache-docker
        with:
          path: /tmp/docker-linux.tar
          key: docker-linux-${{ hashFiles('ci/Dockerfile.Linux') }}

      - name: Build Docker image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          docker build -f ci/Dockerfile.Linux -t iedclient:linux ci/
          docker save iedclient:linux > /tmp/docker-linux.tar

      - name: Load Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: docker load < /tmp/docker-linux.tar

      - name: Run tests (Debug + sanitizers + linter)
        run: >
          docker run --rm -v ${{ github.workspace }}:/workdir
          iedclient:linux
          /workdir/ci/build_inner.sh --check

      - name: Build AppImage + symbols (Release)
        run: >
          docker run --rm -v ${{ github.workspace }}:/workdir
          iedclient:linux
          /workdir/ci/build_inner.sh --release --archive --symbols

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: IEDClient-linux-appimage
          path: dist/*.AppImage

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: IEDClient-linux-symbols
          path: dist/*_syms_*.zip

  deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Docker image
        uses: actions/cache@v4
        id: cache-docker
        with:
          path: /tmp/docker-ubuntu.tar
          key: docker-ubuntu-${{ hashFiles('ci/Dockerfile.Ubuntu') }}

      - name: Build Docker image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          docker build -f ci/Dockerfile.Ubuntu -t iedclient:ubuntu ci/
          docker save iedclient:ubuntu > /tmp/docker-ubuntu.tar

      - name: Load Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: docker load < /tmp/docker-ubuntu.tar

      - name: Build and create .deb
        run: >
          docker run --rm -v ${{ github.workspace }}:/workdir
          iedclient:ubuntu
          /workdir/ci/deb/create_package.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: IEDClient-deb
          path: dist/*.deb

  rpm:
    name: Build .rpm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Docker image
        uses: actions/cache@v4
        id: cache-docker
        with:
          path: /tmp/docker-fedora.tar
          key: docker-fedora-${{ hashFiles('ci/Dockerfile.Fedora') }}

      - name: Build Docker image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          docker build -f ci/Dockerfile.Fedora -t iedclient:fedora ci/
          docker save iedclient:fedora > /tmp/docker-fedora.tar

      - name: Load Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: docker load < /tmp/docker-fedora.tar

      - name: Build and create .rpm
        run: >
          docker run --rm -v ${{ github.workspace }}:/workdir
          iedclient:fedora
          /workdir/ci/rpm/create_package.sh

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: IEDClient-rpm
          path: dist/*.rpm
