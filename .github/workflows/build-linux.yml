name: Build Linux

on: [push, pull_request]

jobs:

  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -f ci/Dockerfile.Linux -t iedclient:linux ci/

      - name: Build and create AppImage
        run: >
          docker run --rm -v ${{ github.workspace }}:/workdir
          iedclient:linux
          /workdir/ci/build_inner.sh --release --archive

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: IEDClient-linux-appimage
          path: dist/*.AppImage

  deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -f ci/Dockerfile.Ubuntu -t iedclient:ubuntu ci/

      - name: Build and create .deb
        run: >
          docker run --rm -v ${{ github.workspace }}:/workdir
          iedclient:ubuntu
          /workdir/ci/deb/create_package.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: IEDClient-deb
          path: dist/*.deb

  rpm:
    name: Build .rpm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -f ci/Dockerfile.Fedora -t iedclient:fedora ci/

      - name: Build and create .rpm
        run: >
          docker run --rm -v ${{ github.workspace }}:/workdir
          iedclient:fedora
          /workdir/ci/rpm/create_package.sh

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: IEDClient-rpm
          path: dist/*.rpm
